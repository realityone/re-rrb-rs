[package]
name = "rerrb"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "rerrb"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tun-rs = { version = "2", features = ["async"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 2
overflow-checks = false

[profile.release]
lto = true
codegen-units = 1
