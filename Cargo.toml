[workspace]
members = ["crates/rrb-common", "crates/rrb-ebpf", "crates/rrb-loader"]
# rrb-ebpf targets bpfel-unknown-none and is built by rrb-loader's build
# script via aya-build, so it is not a default member of host builds.
default-members = ["crates/rrb-common", "crates/rrb-loader"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 2
overflow-checks = false

[profile.release]
lto = true
codegen-units = 1
