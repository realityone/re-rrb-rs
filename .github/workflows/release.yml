# Build the aarch64 .deb and attach it to a GitHub release.
# Trigger: push a version tag, e.g. `git tag v0.1.0 && git push --tags`.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      # The UDR's glibc (UniFi OS, ~2.31) is older than any GitHub runner's,
      # so a gnu build fails with "GLIBC_2.xx not found" on the device.
      # Link musl statically instead: the binary then has no libc
      # dependency at all. musl.cc is unreachable from GitHub Actions, so
      # the toolchain comes from cross's Docker image on ghcr.io (GitHub's
      # own registry).
      - uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build rerrb (aarch64, static musl)
        run: |
          cross build --release --locked --target aarch64-unknown-linux-musl
          readelf -d target/aarch64-unknown-linux-musl/release/rerrb | grep NEEDED || echo "fully static"

      - name: Package .deb
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build --target aarch64-unknown-linux-musl --output rerrb_arm64.deb

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: rerrb_arm64.deb
          generate_release_notes: true
