# Build the aarch64 .deb and attach it to a GitHub release.
# Trigger: push a version tag, e.g. `git tag v0.1.0 && git push --tags`.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      # The UDR's glibc (UniFi OS, ~2.31) is older than any GitHub runner's,
      # so a gnu build fails with "GLIBC_2.xx not found" on the device.
      # Link musl statically instead: the binary then has no libc
      # dependency at all. musl.cc provides the aarch64 cross toolchain.
      - name: Install musl cross toolchain
        run: |
          curl -fsSLO https://musl.cc/aarch64-linux-musl-cross.tgz
          tar xzf aarch64-linux-musl-cross.tgz
          echo "$PWD/aarch64-linux-musl-cross/bin" >> "$GITHUB_PATH"

      - name: Build rerrb (aarch64, static musl)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-musl-gcc
        run: |
          cargo build --release --locked --target aarch64-unknown-linux-musl
          aarch64-linux-musl-readelf -d target/aarch64-unknown-linux-musl/release/rerrb | grep NEEDED || echo "fully static"

      - name: Package .deb
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build --target aarch64-unknown-linux-musl --output rerrb_arm64.deb

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: rerrb_arm64.deb
          generate_release_notes: true
